<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Items All - VOID Spawner UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #07080b radial-gradient(circle at 50% 10%, rgba(20, 24, 38, 0.8) 0%, rgba(7, 8, 11, 0.95) 100%);
            color: #e2e8f0;
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 16px 20px;
        }

        /* Header Bar */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: rgba(13, 15, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .keys-legend {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: #94a3b8;
            direction: rtl;
        }

        .key-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .key-badge kbd {
            background: #1e2230;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 1px 5px;
            border-radius: 4px;
            font-family: 'Rajdhani', monospace;
            font-size: 11px;
            font-weight: 700;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
            direction: ltr;
        }

        .header-title-box img {
            height: 36px;
            width: auto;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }

        .header-title-box h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .header-title-box span {
            color: #38bdf8;
            font-size: 12px;
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 700;
        }

        /* Main Workspace: Left Grid + Right Categories Sidebar */
        .workspace {
            display: flex;
            gap: 14px;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        /* Left Content Area (Search + Grid) */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: rgba(11, 13, 19, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px;
            backdrop-filter: blur(10px);
        }

        .search-container {
            position: relative;
            margin-bottom: 12px;
        }

        .search-input {
            width: 100%;
            background: #0f1118;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 40px 10px 16px;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            background: #141722;
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 15px;
            pointer-events: none;
        }

        .grid-container {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            padding-right: 4px;
            align-content: start;
        }

        .grid-container::-webkit-scrollbar {
            width: 6px;
        }

        .grid-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .grid-container::-webkit-scrollbar-thumb {
            background: #1e2433;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .grid-container::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        /* Item Card matching screenshot */
        .item-card {
            background: #0d0f15;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            height: 180px;
        }

        .item-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: #131620;
        }

        .item-card.selected {
            border: 2px solid #ffffff !important;
            background: #161924 !important;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.35), inset 0 0 10px rgba(255, 255, 255, 0.08) !important;
            transform: translateY(-2px);
        }

        .card-img-box {
            width: 100%;
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .card-img-box img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
            transition: transform 0.2s ease;
        }

        .item-card:hover .card-img-box img,
        .item-card.selected .card-img-box img {
            transform: scale(1.08);
        }

        .card-info {
            width: 100%;
            text-align: center;
            margin-top: auto;
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            margin-bottom: 3px;
        }

        .card-code {
            font-family: 'Rajdhani', monospace;
            font-size: 10px;
            color: #64748b;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            direction: ltr;
        }

        .item-card.selected .card-code {
            color: #94a3b8;
        }

        /* Right Sidebar Categories */
        .sidebar {
            width: 220px;
            background: rgba(11, 13, 19, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            min-height: 0;
        }

        .sidebar-header {
            font-size: 12px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            padding: 4px 10px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 2px;
        }

        .category-list::-webkit-scrollbar {
            width: 4px;
        }

        .category-list::-webkit-scrollbar-thumb {
            background: #1e2433;
            border-radius: 2px;
        }

        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .category-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
        }

        .category-item.active {
            background: #ffffff !important;
            color: #07080b !important;
            font-weight: 900;
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.4);
        }

        .category-count {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.3);
            color: #94a3b8;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .category-item.active .category-count {
            background: rgba(0, 0, 0, 0.12);
            color: #07080b;
        }

        /* Bottom Control Bar */
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: rgba(13, 15, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            margin-top: 12px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }

        .spawn-action-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .spawn-btn {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            border: none;
            padding: 8px 24px;
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: all 0.15s ease;
        }

        .spawn-btn:hover {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.5);
            transform: scale(1.02);
        }

        .spawn-btn kbd {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'Rajdhani', monospace;
            font-size: 11px;
        }

        .qty-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0c0e14;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 8px;
        }

        .qty-label {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
        }

        .qty-btn {
            background: #1a1e2a;
            color: #38bdf8;
            border: 1px solid #334155;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', monospace;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .qty-btn:hover {
            background: #252b3c;
            color: #ffffff;
        }

        .qty-value {
            font-family: 'Rajdhani', monospace;
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            min-width: 34px;
            text-align: center;
        }

        .selected-preview {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .preview-thumb {
            width: 44px;
            height: 44px;
            background: #090a0f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-thumb img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        .preview-text {
            text-align: right;
        }

        .preview-title {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
        }

        .preview-code {
            font-family: 'Rajdhani', monospace;
            font-size: 11px;
            color: #38bdf8;
            direction: ltr;
        }

        .watermark {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 800;
            color: #475569;
            letter-spacing: 1px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: #10b981;
            color: #ffffff;
            padding: 8px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="header-bar">
        <div class="keys-legend">
            <span class="key-badge"><kbd>Esc</kbd> إغلاق</span>
            <span class="key-badge"><kbd>F</kbd> بحث</span>
            <span class="key-badge"><kbd>Enter</kbd> سبون</span>
            <span class="key-badge"><kbd>Q</kbd> <kbd>E</kbd> الكمية</span>
            <span class="key-badge"><kbd>◄</kbd> <kbd>►</kbd> العناصر</span>
            <span class="key-badge"><kbd>▲</kbd> <kbd>▼</kbd> الأقسام</span>
        </div>

        <div class="header-title-box">
            <img src="V1.png" alt="Logo" onerror="this.style.display='none'">
            <h1>Add Items All</h1>
            <span>VOID SPAWNER</span>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
        <!-- Left Content Area -->
        <div class="main-content">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="...جاري البحث عن سلاح أو أيتم (اضغط F للتركيز)..." oninput="handleSearch()">
                <span class="search-icon">🔍</span>
            </div>

            <div class="grid-container" id="itemsGrid">
                <!-- Items injected dynamically -->
            </div>
        </div>

        <!-- Right Categories Sidebar (Matching Screenshot) -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>الأقسام</span>
                <span id="totalItemsCountBadge">0</span>
            </div>
            <div class="category-list" id="categoryList">
                <!-- Categories injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Bottom Control Bar -->
    <div class="bottom-bar">
        <div class="spawn-action-box">
            <button class="spawn-btn" id="spawnButton" onclick="triggerSpawn()">
                <kbd>Enter</kbd>
                <span>سبون</span>
            </button>

            <div class="qty-box">
                <span class="qty-label">الكمية</span>
                <button class="qty-btn" onclick="changeQty(-1)">Q</button>
                <span class="qty-value" id="qtyDisplay">1</span>
                <button class="qty-btn" onclick="changeQty(1)">E</button>
            </div>
        </div>

        <div class="selected-preview">
            <div class="preview-text">
                <div class="preview-title" id="previewTitle">---</div>
                <div class="preview-code" id="previewCode">---</div>
            </div>
            <div class="preview-thumb">
                <img id="previewImg" src="" alt="" style="display:none;">
            </div>
        </div>

        <div class="watermark">
            VOID
        </div>
    </div>

    <div class="toast" id="toastMsg">تم رسبنة الأيتم بنجاح!</div>

        let currentCategoryIdx = 0;

        const gridEl = document.getElementById('itemsGrid');
        const catListEl = document.getElementById('categoryList');
        const searchInput = document.getElementById('searchInput');
        const qtyDisplay = document.getElementById('qtyDisplay');
        const previewTitle = document.getElementById('previewTitle');
        const previewCode = document.getElementById('previewCode');
        const previewImg = document.getElementById('previewImg');
        const toastEl = document.getElementById('toastMsg');
        const totalBadge = document.getElementById('totalItemsCountBadge');

        // Initialize Categories Sidebar
        function renderCategories() {
            catListEl.innerHTML = '';
            let total = 0;
            categories.forEach((cat, idx) => {
                total += cat.items.length;
                const div = document.createElement('div');
                div.className = 'category-item' + (idx === currentCategoryIdx ? ' active' : '');
                div.innerHTML = `
                    <span>${cat.title}</span>
                    <span class="category-count">${cat.items.length}</span>
                `;
                div.onclick = () => selectCategory(idx);
                catListEl.appendChild(div);
            });
            totalBadge.innerText = total;
        }

        function selectCategory(idx) {
            currentCategoryIdx = idx;
            currentItemIdx = 0;
            renderCategories();
            searchInput.value = '';
            filterAndDisplayItems();
        }

        function filterAndDisplayItems() {
            const query = searchInput.value.trim().toLowerCase();
            const currentCat = categories[currentCategoryIdx];

            if (!query) {
                activeItems = currentCat ? currentCat.items : [];
            } else {
                // Search across all categories if query entered, or prioritize current
                let matches = [];
                categories.forEach(c => {
                    c.items.forEach(itm => {
                        if (itm.id.toLowerCase().includes(query) || (itm.desc && itm.desc.toLowerCase().includes(query)) || (itm.spawnCode && itm.spawnCode.toLowerCase().includes(query))) {
                            matches.push(itm);
                        }
                    });
                });
                activeItems = matches;
            }

            renderGrid();
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            if (activeItems.length === 0) {
                gridEl.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px; font-weight: 700;">لا توجد أيتمات مطابقة للبحث</div>';
                updatePreview(null);
                return;
            }

            if (currentItemIdx >= activeItems.length) currentItemIdx = 0;

            activeItems.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'item-card' + (idx === currentItemIdx ? ' selected' : '');
                card.innerHTML = `
                    <div class="card-img-box">
                        <img src="${item.imgSrc}" alt="${item.displayCode}" onerror="this.src='https://via.placeholder.com/90x90/11131a/475569?text=IMG'">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.desc && item.desc.trim() !== '' ? item.desc : item.displayCode}</div>
                        <div class="card-code">${item.spawnCode}</div>
                    </div>
                `;
                card.onclick = () => {
                    currentItemIdx = idx;
                    renderGrid();
                };
                card.ondblclick = () => {
                    currentItemIdx = idx;
                    triggerSpawn();
                };
                gridEl.appendChild(card);
            });

            updatePreview(activeItems[currentItemIdx]);
            scrollSelectedItemIntoView();
        }

        function updatePreview(item) {
            if (!item) {
                previewTitle.innerText = '---';
                previewCode.innerText = '---';
                previewImg.style.display = 'none';
                return;
            }
            previewTitle.innerText = item.desc && item.desc.trim() !== '' ? item.desc : item.displayCode;
            previewCode.innerText = item.spawnCode;
            previewImg.src = item.imgSrc;
            previewImg.style.display = 'block';
        }

        function scrollSelectedItemIntoView() {
            const selected = gridEl.querySelector('.item-card.selected');
            if (selected) {
                selected.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function changeQty(delta) {
            currentQuantity = Math.max(1, Math.min(250, currentQuantity + delta));
            qtyDisplay.innerText = currentQuantity;
        }

        function handleSearch() {
            currentItemIdx = 0;

        function showToast(msg) {
            toastEl.innerText = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 1600);
        }

        function triggerSpawn() {
            if (!activeItems || activeItems.length === 0) return;
            const item = activeItems[currentItemIdx];
            if (!item) return;

            const spawnData = {
                action: 'spawnItem',
                item: item.spawnCode,
                amount: currentQuantity,
                rawId: item.id
            };

            // 1. Post to FiveM NUI callback if in standard resource
            if (window.GetParentResourceName) {
                try {
                    fetch(`https://${GetParentResourceName()}/spawnItem`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                        body: JSON.stringify(spawnData)
                    }).catch(() => {});
                } catch (e) {}
            }

            // 2. Hash & Console signal for FiveM DUI bridge
            window.location.hash = `spawn:${item.spawnCode}:${currentQuantity}:${Date.now()}`;
            console.log(`VOID_SPAWN:${item.spawnCode}:${currentQuantity}`);

            // 3. Fallback Clipboard Copy
            if (navigator.clipboard) {
                navigator.clipboard.writeText(item.spawnCode).catch(() => {});
            }

            showToast(`تم طلب رسبنة: ${currentQuantity}x ${item.spawnCode}`);
        }

            const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            if (activeTag === 'input' && e.key !== 'Escape' && e.key !== 'Enter') return;

            if (e.key === 'Escape') {

                }
            }

            if (e.key === 'q' || e.key === 'Q' || e.key === 'ض') {
                changeQty(-1);
                return;
            }

            if (e.key === 'e' || e.key === 'E' || e.key === 'ث') {
                changeQty(1);
                return;
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                if (document.activeElement === searchInput) {
                    searchInput.blur();
                }
                triggerSpawn();
                return;
            }

            if (e.key === 'Tab') {
                e.preventDefault();
                focusArea = (focusArea === 'grid') ? 'sidebar' : 'grid';
                if (focusArea === 'sidebar') {
                    const activeCat = catListEl.querySelector('.category-item.active');
                    if (activeCat) activeCat.scrollIntoView({ block: 'nearest' });
                }
                return;
            }

            // Navigation via Arrows
            if (focusArea === 'sidebar') {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (currentCategoryIdx > 0) selectCategory(currentCategoryIdx - 1);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (currentCategoryIdx < categories.length - 1) selectCategory(currentCategoryIdx + 1);
                } else if (e.key === 'ArrowLeft' || e.key === 'Enter') {
                    e.preventDefault();
                    focusArea = 'grid';
                }
            } else {
                // Grid Focus
                const cols = Math.max(1, Math.floor(gridEl.clientWidth / 190));
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (currentItemIdx % cols === 0) {
                        // Switch focus to category sidebar on the right!
                        focusArea = 'sidebar';
                    } else if (currentItemIdx > 0) {
                        currentItemIdx--;
                        renderGrid();
                    }
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (currentItemIdx < activeItems.length - 1) {
                        currentItemIdx++;
                        renderGrid();
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (currentItemIdx + cols < activeItems.length) {
                        currentItemIdx += cols;
                        renderGrid();
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (currentItemIdx - cols >= 0) {
                        currentItemIdx -= cols;
                        renderGrid();
                    }
                }
            }
        });

        // FiveM DUI Message Listener
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data) return;
            if (data.action === 'setCategory' && typeof data.categoryIndex === 'number') {
                selectCategory(data.categoryIndex);
            } else if (data.action === 'spawnSelected') {
                triggerSpawn();
            } else if (data.action === 'changeQty') {
                changeQty(data.delta || 1);
            }
        });

        // Initial render
        renderCategories();
        filterAndDisplayItems();
    </script>
</body>
</html>
